# Casa Grande Hotel: website + REST API (Laravel), Payment API, MySQL.
#   cp .env.docker.example .env.docker      (then edit the secrets)
#   docker compose --env-file .env.docker up -d --build
services:
  app:
    build: .
    image: casa-grande-hotel:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "Casa Grande Hotel"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-casa_grande}
      DB_USERNAME: ${DB_USERNAME:-casa}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      HOTEL_API_KEY: ${HOTEL_API_KEY:?Set HOTEL_API_KEY in .env.docker}
      PAYMENT_API_URL: http://payment:8080/api.php/charges
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:?Set PAYMENT_API_KEY in .env.docker}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: "${BREVO_SENDER_NAME:-Casa Grande Hotel}"
    depends_on:
      db:
        condition: service_healthy
      payment:
        condition: service_started

  payment:
    build: ./payment-api
    image: casa-grande-payment-api:latest
    restart: unless-stopped
    environment:
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:?Set PAYMENT_API_KEY in .env.docker}
    # not published: only the app container can reach it (System 1 -> System 2)

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-casa_grande}
      MYSQL_USER: ${DB_USERNAME:-casa}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dbdata:
